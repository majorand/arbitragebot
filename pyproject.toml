[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitragebot"
version = "0.1.0"
description = "Modular sports betting agent with data ingestion, strategy, and execution layers."
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.3",
  "PyYAML>=6.0.2",
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.5",
  "supabase>=2.4.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
arbitrage-backend = "web.backend.app:app"
arbitrage-bot = "arbitragebot.main:run_once"