name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3

    - name: Ensure frontend lockfile exists
      run: |
        if [ -f web/frontend/package.json ] && [ ! -f web/frontend/package-lock.json ]; then
          cd web/frontend
          npm install --package-lock-only
        fi

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: web/frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd web/frontend
        npm install

    - name: Lint code
      run: |
        cd web/frontend
        npm run lint || true

    - name: Build
      run: |
        cd web/frontend
        npm run build

    - name: Type check
      run: |
        cd web/frontend
        npm run type-check || true

    - name: Store build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: web/frontend/.next
        retention-days: 1
